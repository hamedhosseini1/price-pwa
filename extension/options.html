<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>تنظیمات قیمت لحظه‌ای</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
body { font-family: Vazirmatn, Tahoma, sans-serif; max-width: 480px; margin: 32px auto; padding: 0 16px; line-height: 2; color: #0f1f33; }
label { display: block; font-weight: 700; margin-top: 16px; }
input, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-family: inherit; direction: ltr; text-align: left; }
button { margin-top: 20px; background: #0e7c7b; color: #fff; border: 0; border-radius: 10px; padding: 10px 28px; font-family: inherit; font-weight: 700; cursor: pointer; }
#msg { color: #0d9d6c; font-size: 13px; }
.hint { font-size: 12px; color: #5b6b82; }
</style>
</head>
<body>
<h2>تنظیمات اکستنشن قیمت لحظه‌ای</h2>
<label>آدرس سرور اپ (API base)</label>
<input id="base" placeholder="http://localhost:3000">
<p class="hint">پیش‌فرض لوکال‌هاست است. اگر اپ را روی هاست/سرور دیپلوی کردید، آدرسش را اینجا بگذارید و دامنه را به <code>host_permissions</code> در <code>manifest.json</code> اضافه کنید.</p>
<label>واحد پیش‌فرض</label>
<select id="currency"><option value="IRT">تومان</option><option value="USD">دلار</option></select>
<label>اعداد</label>
<select id="digits"><option value="fa">فارسی (۱۲۳)</option><option value="en">انگلیسی (123)</option></select>
<label>فاصله به‌روزرسانی بج (دقیقه)</label>
<select id="minutes"><option value="1">۱</option><option value="5">۵</option><option value="15">۱۵</option><option value="30">۳۰</option></select>
<br><button id="save">ذخیره</button> <span id="msg"></span>
<script type="module" src="options.js"></script>
</body>
</html>
